
<!DOCTYPE html>
<html lang="ko">

  <link rel="stylesheet" href="style3.css">
</head>
<body>

  <div class="container">
    <!-- 배경 장식 -->
    <div class="floating-clovers">
    <span>🍀</span>
    <span>☘</span>
    <span>🍀</span>
    <span>☘</span>

    <p class="sub">A LITTLE GIFT FOR YOU</p>

    <h1>A Little Luck</h1>


<!-- 클릭 기능 -->
<input type="checkbox" id="open-letter">

<!-- 네잎클로버 -->
<label for="open-letter" class="clover">

  <div class="leaf leaf1"></div>
  <div class="leaf leaf2"></div>
  <div class="leaf leaf3"></div>
  <div class="leaf leaf4"></div>
  <div class="stem"></div>

</label>

<p class="click-guide">클로버를 눌러 편지를 열어봐 ♡</p>

<!-- 숨겨진 편지 -->

<div class="letter">

  <div class="letter-top">A LETTER FOR YOU ♡</div>

  <h2>🍀 언니에게 전하는 편지</h2>

  <div class="letter-line"></div>

  <p>
    긴 시간 동안 정말 수고 많았어<br>
    여기까지 달려온 언니에게<br>
    작은 행운을 보내고 싶어!!
  </p>

  <p>
    열심히 준비한만큼 분명히 좋은 결과 있을거니까<br>
    긴장보다 자신감이 가득하길 바라
  </p>

  <p>
    어떤 결과가 기다리고 있더라도<br>
    지금까지 노력해 온 언니를<br>
    꼭 칭찬해 줬으면 좋겠어
  </p>

  <div class="letter-bottom">
    언제나 언니의 행운을 빌게 ♡
  </div>

</div>


</body>
</html>
